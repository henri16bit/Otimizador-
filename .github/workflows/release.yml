name: Publish Windows release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.2.0-preview.2

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging
        id: packaging_tests
        run: python -m unittest discover -s tests/package_tests -v
      - name: Test release publication without contacting GitHub
        id: release_tests
        shell: pwsh
        run: ./tests/release_tests/ReleasePublication.Tests.ps1
      - name: Restore locked dependencies
        id: restore
        run: dotnet restore PCAnalyzer.sln --locked-mode
      - name: Build with warnings as errors
        id: build
        run: dotnet build PCAnalyzer.sln -c Release --no-restore -warnaserror
      - name: Test application
        id: tests
        run: dotnet test tests/PCAnalyzer.Tests/PCAnalyzer.Tests.csproj -c Release --no-build --no-restore --logger trx
      - name: Package self-contained Windows application
        id: package
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Open and render the packaged WPF application
        id: smoke
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Publish ZIP and SHA256
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: tests/PCAnalyzer.Tests/TestResults/*.trx
          if-no-files-found: warn
      - name: Preserve startup verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-startup-results
          path: |
            artifacts/startup-smoke-*.json
            artifacts/startup-smoke-*.png
            artifacts/release-publication.json
          if-no-files-found: warn
      - name: Record publication result for Git clients
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh
        env:
          RELEASE_STEPS: ${{ toJSON(steps) }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/record-release-result.ps1
