name: Publish Windows release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging
        run: python -m unittest discover -s tests/package_tests -v
      - name: Restore locked dependencies
        run: dotnet restore PCAnalyzer.sln --locked-mode
      - name: Build with warnings as errors
        run: dotnet build PCAnalyzer.sln -c Release --no-restore -warnaserror
      - name: Test application
        run: dotnet test tests/PCAnalyzer.Tests/PCAnalyzer.Tests.csproj -c Release --no-build --no-restore --logger trx
      - name: Package self-contained Windows application
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Publish ZIP and SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "PC Performance Analyzer $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE) { throw 'Falha ao criar o rascunho da versão.' }
          } else {
            $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
            if ($LASTEXITCODE) { throw 'Falha ao consultar a versão.' }
            if ($isDraft -ne 'true') { throw 'A versão já está publicada; use uma nova tag para substituí-la.' }
          }
          gh release upload $env:RELEASE_TAG artifacts/PCAnalyzer-windows-x64.zip artifacts/PCAnalyzer-windows-x64.zip.sha256 --clobber
          if ($LASTEXITCODE) { throw 'Falha ao enviar os arquivos da versão.' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Falha ao publicar a versão.' }
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: tests/PCAnalyzer.Tests/TestResults/*.trx
          if-no-files-found: warn
